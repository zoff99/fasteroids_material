name: Screens Only Windows

on:
  push:
    paths-ignore:
     - 'README.md'
     - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
     - 'README.md'
     - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version:
        description: dummy
        default: dummy

defaults:
  run:
    shell: bash

jobs:
  windows-test:
    runs-on: windows-latest
    if: ${{ true }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Display the path
        run: echo %PATH%
        shell: cmd

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'

      - name: java-version
        run: java -version
        shell: bash

      - name: activate showcase mode
        shell: bash
        run: |
             sed -i -e 's#DEMO_SHOWCASE_DEBUG_ONLY = false#DEMO_SHOWCASE_DEBUG_ONLY = true#' ./src/main/kotlin/FasteroidsMain.kt

      - name: compile-app
        shell: bash
        run: |
          ./gradlew.bat assemble

      - name: app_startup
        shell: bash
        run: |
          ./gradlew.bat run > runlog.txt 2>&1 &

      - name: sleep
        shell: bash
        run: |
            sleep 30

      - name: capture-screen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $Screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $Width  = $Screen.Width
          $Height = $Screen.Height
          $Left   = $Screen.Left
          $Top    = $Screen.Top
          $bitmap  = New-Object System.Drawing.Bitmap $Width, $Height
          $graphic = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphic.CopyFromScreen($Left, $Top, 0, 0, $bitmap.Size)
          $bitmap.Save("D:\a\fasteroids_material\fasteroids_material\screenshot-windows.png")
          Write-Output "Screenshot saved to:"
          Write-Output D:\a\fasteroids_material\fasteroids_material\screenshot-windows.png

      - name: upload-screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-windows
          path: |
            D:\a\fasteroids_material\fasteroids_material\screenshot-windows.png

      - name: Upload to nightly release
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/master'
        with:
          allowUpdates: true
          tag: nightly
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "screenshot-windows.png"



